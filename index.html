<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALE STORE — Sneaker Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar">
    <img src="logo.png" alt="ALE STORE" class="logo-nav" />
    <a href="https://wa.me/51970311300" target="_blank" class="btn-nav-wa">💬 WhatsApp</a>
  </nav>

  <!-- BANNER PRINCIPAL (HERO) -->
  <section class="hero">
    <div class="hero-contenido">
      <h1>Encuentra tu par perfecto</h1>
      <p>Las mejores marcas y los modelos más exclusivos en ALE STORE.</p>
      <a href="#catalogo" class="btn-hero">Ver Catálogo 👟</a>
    </div>
  </section>

  <!-- BARRA DE HERRAMIENTAS (BUSCADOR Y FILTROS) -->
  <section class="barra-herramientas" id="catalogo">
    <h2 class="titulo-seccion">Nuestro Catálogo</h2>
    <input type="text" id="buscador" placeholder="🔍 Buscar modelo o marca..." />
    
    <div class="filtros">
      <select id="filtroMarca">
        <option value="">Todas las marcas</option>
      </select>
      <select id="filtroGenero">
        <option value="">Todos los géneros</option>
        <option value="Hombre">Hombre</option>
        <option value="Mujer">Mujer</option>
        <option value="Unisex">Unisex</option>
        <option value="Niño">Niño</option>
      </select>
      <select id="filtroTalla">
        <option value="">Todas las tallas</option>
      </select>
      <select id="filtroPrecio">
        <option value="">Cualquier precio</option>
        <option value="0-100">Hasta S/ 100</option>
        <option value="100-150">S/ 100 - S/ 150</option>
        <option value="150-200">S/ 150 - S/ 200</option>
        <option value="200-9999">Más de S/ 200</option>
      </select>
      
      <label class="check">
        <input type="checkbox" id="soloDisponibles" checked />
        Solo disponibles
      </label>
      <label class="check destacado">
        <input type="checkbox" id="soloNuevos" />
        ✨ Nuevos ingresos
      </label>
    </div>
  </section>

  <!-- CATÁLOGO DE PRODUCTOS -->
  <main id="catalogo-grid" class="grid">
    <p style="padding:20px">Cargando catálogo...</p>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer>
    <div class="redes">
      <a href="https://www.tiktok.com/@ale.store7?_t=8ma1BT1YIwH&_r=" target="_blank" rel="noopener">TikTok</a>
      <a href="https://www.facebook.com/STOREalejo/" target="_blank" rel="noopener">Facebook</a>
      <a href="https://www.instagram.com/alee_stor/" target="_blank" rel="noopener">Instagram</a>
    </div>
    <p>© 2025 ALE STORE — Hecho con ❤️</p>
  </footer>

  <!-- MODAL (GALERÍA DE FOTOS) -->
  <div id="modal" class="modal oculto">
    <div class="modal-contenido">
      <button class="cerrar" onclick="cerrarModal()">✕</button>
      <div class="modal-imagen-principal">
        <img id="modalFotoGrande" src="" alt="" />
      </div>
      <div id="modalMiniaturas" class="miniaturas"></div>
      <div class="modal-info">
        <h2 id="modalModelo"></h2>
        <p id="modalMarca"></p>
        <p id="modalGenero"></p>
        <p id="modalTalla"></p>
        <p id="modalPrecio"></p>
        <p id="modalNotas"></p>
        
        <div class="acciones-modal">
          <button class="btn-wa" id="modalBtnWA">Pedir por WhatsApp</button>
          <button class="btn-compartir" id="modalBtnCompartir">📤 Compartir</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
