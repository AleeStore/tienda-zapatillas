<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALE STORE — Sneaker Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <!-- Tu logo aquí -->
    <img src="logo.png" alt="ALE STORE Logo" class="logo" />
    <p>Encuentra tu par y pide por WhatsApp</p>
  </header>

  <section class="filtros">
    <select id="filtroMarca">
      <option value="">Todas las marcas</option>
    </select>
    <select id="filtroTalla">
      <option value="">Todas las tallas</option>
    </select>
    <label class="check">
      <input type="checkbox" id="soloDisponibles" checked />
      Solo disponibles
    </label>
  </section>

  <main id="catalogo" class="grid">
    <p style="padding:20px">Cargando catálogo...</p>
  </main>

  <footer>
    <div class="redes">
      <a href="https://www.tiktok.com/@ale.store7?_t=8ma1BT1YIwH&_r=" target="_blank" rel="noopener">TikTok</a>
      <a href="https://www.facebook.com/STOREalejo/" target="_blank" rel="noopener">Facebook</a>
      <a href="https://www.instagram.com/alee_stor/" target="_blank" rel="noopener">Instagram</a>
    </div>
    <p>© 2025 ALE STORE — Hecho con ❤️</p>
  </footer>

  <!-- Modal para ver fotos grandes -->
  <div id="modal" class="modal oculto">
    <div class="modal-contenido">
      <button class="cerrar" onclick="cerrarModal()">✕</button>
      <div class="modal-imagen-principal">
        <img id="modalFotoGrande" src="" alt="" />
      </div>
      <div id="modalMiniaturas" class="miniaturas"></div>
      <div class="modal-info">
        <h2 id="modalModelo"></h2>
        <p id="modalMarca"></p>
        <p id="modalTalla"></p>
        <p id="modalPrecio"></p>
        <p id="modalNotas"></p>
        <button class="btn-wa" id="modalBtnWA">Pedir por WhatsApp</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
